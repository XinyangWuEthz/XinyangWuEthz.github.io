 <title id="capacity-title">Queue ordering changes which reviews finish, without increasing capacity</title><desc id="capacity-description">Two stacked horizontal bars show mean completed reviews across 20 paired simulation seeds at 180 admitted jobs per hour, with four reviewers, two minutes per job, and an eight-hour shift. FIFO completes 135.60 high-risk and 819.65 other reviews. Default severity completes 189.35 high-risk and 765.90 other reviews. Both complete 955.25 in total. Severity therefore completes 53.75 more high-risk reviews and 53.75 fewer other reviews.</desc><metadata>
